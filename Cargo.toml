[package]
name = "ender"
version = "0.1.0"
edition = "2024"
description = "A cross-platform Minecraft NeoForge manager"
license = "MIT"
repository = "https://github.com/scirats/ender"
homepage = "https://github.com/scirats/ender"
readme = "README.md"
keywords = ["minecraft", "neoforge", "prism-launcher", "server", "cli"]
categories = ["command-line-utilities", "games"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
dirs = "6.0"
flate2 = "1.1"
futures-util = "0.3"
google-drive3 = "7"
hex = "0.4"
sha2 = "0.10"
http-body-util = "0.1"
mime = "0.3"
quick-xml = { version = "0.37", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "macros", "process", "rt-multi-thread", "time"] }
toml = "0.9"
sysinfo = "0.37"
yup-oauth2 = { version = "12", features = ["hyper-rustls"] }
zip = "6.0"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.23"
