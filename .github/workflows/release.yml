name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/ender staging/ender
          tar -czf ender-${GITHUB_REF_NAME#v}-${{ matrix.target }}.tar.gz -C staging ender
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ender.exe" staging/ender.exe
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path staging/ender.exe -DestinationPath "ender-$version-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ender-${{ matrix.target }}
          path: ender-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ender-*
          merge-multiple: true
      - name: Generate checksums and Scoop manifest
        shell: bash
        run: |
          cd dist
          sha256sum ender-* > SHA256SUMS
          version="${GITHUB_REF_NAME#v}"
          windows_url="https://github.com/scirats/ender/releases/download/${GITHUB_REF_NAME}/ender-${version}-x86_64-pc-windows-msvc.zip"
          windows_sha="$(sha256sum "ender-${version}-x86_64-pc-windows-msvc.zip" | cut -d ' ' -f 1)"
          cat > ender.json <<EOF
          {
            "version": "${version}",
            "description": "Cross-platform Minecraft NeoForge manager",
            "homepage": "https://github.com/scirats/ender",
            "license": "MIT",
            "architecture": { "64bit": { "url": "${windows_url}", "hash": "${windows_sha}" } },
            "bin": "ender.exe",
            "checkver": { "github": "https://github.com/scirats/ender" },
            "autoupdate": { "architecture": { "64bit": { "url": "https://github.com/scirats/ender/releases/download/v\$version/ender-\$version-x86_64-pc-windows-msvc.zip" } } }
          }
          EOF
      - name: Build Arch package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > dist/PKGBUILD <<EOF
          pkgname=ender
          pkgver=${version}
          pkgrel=1
          pkgdesc='Cross-platform Minecraft NeoForge manager'
          arch=('x86_64')
          url='https://github.com/scirats/ender'
          license=('MIT')
          depends=('glibc')
          source=("ender-${version}-x86_64-unknown-linux-gnu.tar.gz")
          sha256sums=('SKIP')

          package() {
            install -Dm755 "ender" "\${pkgdir}/usr/bin/ender"
          }
          EOF
          docker run --rm -v "$PWD/dist:/dist" archlinux:base-devel bash -c '
            useradd --create-home builder
            chown -R builder:builder /dist
            cd /dist
            su builder -c "makepkg --nodeps --noconfirm"
          '
          chown -R "$(id -u):$(id -g)" dist
          rm dist/PKGBUILD dist/ender-debug-*.pkg.tar.zst
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "$GITHUB_REPOSITORY" --title "Ender ${GITHUB_REF_NAME#v}" --generate-notes
